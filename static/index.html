<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sovereign AI</title>
<style>
  :root {
    --bg-page: #000000;
    --bg-surface: #1e2025;
    --bg-surface-hover: #2a2d35;
    --bg-input: #15181f;
    --border-color: rgba(255, 255, 255, 0.06);
    --border-hover: rgba(255, 255, 255, 0.12);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent: #10b981;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background-color: #000000;
    color: var(--text-primary);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    background: radial-gradient(circle at center, #1e1e24 0%, #0a0a0c 60%, #000000 100%);
  }

  #app {
    display: flex;
    flex-direction: column;
    width: 100vw;
    height: 100vh;
    position: relative;
  }

  @font-face {
    font-family: 'Blanka';
    src: url('/fonts/blanka.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  /* ── TOP BAR ── */
  header {
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    flex-shrink: 0;
    z-index: 10;
    position: relative;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 2;
  }
  .brand-title {
    font-family: 'Blanka', sans-serif;
    font-size: 16px;
    letter-spacing: 2.5px;
    color: var(--text-primary);
    line-height: 1;
    display: inline-block;
    padding-top: 1px;
    user-select: none;
  }
  .logo-icon {
    width: 20px;
    height: 20px;
  }

  .header-center {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    pointer-events: auto;
    z-index: 1;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border-color);
    border-radius: 9999px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
  }
  .status-dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 2;
  }

  .new-chat-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border-color);
    border-radius: 9999px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s ease;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    font-family: inherit;
    outline: none;
  }
  .new-chat-btn svg {
    transition: transform 0.2s ease;
  }
  .new-chat-btn:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: var(--border-hover);
    color: var(--text-primary);
  }
  .new-chat-btn:hover svg {
    transform: rotate(90deg);
  }
  .new-chat-btn:active {
    transform: scale(0.96);
  }

  /* ── ANIMATIONS ── */
  @keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
    100% { transform: translateY(0px); }
  }
  @keyframes wave {
    0% { transform: rotate(0.0deg) }
    10% { transform: rotate(14.0deg) }
    20% { transform: rotate(-8.0deg) }
    30% { transform: rotate(14.0deg) }
    40% { transform: rotate(-4.0deg) }
    50% { transform: rotate(10.0deg) }
    60% { transform: rotate(0.0deg) }
    100% { transform: rotate(0.0deg) }
  }
  @keyframes fadeInUp {
    0% { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulseGlow {
    0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
    70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
    100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
  }

  /* ── RED BREATHING GLOW FOR CHAT CAPSULE ── */
  @keyframes redCapsuleGlow {
    0% {
      border-color: rgba(220, 38, 38, 0.45);
      box-shadow: 0 0 10px rgba(220, 38, 38, 0.20),
                  0 0 20px rgba(220, 38, 38, 0.08);
    }
    50% {
      border-color: rgba(239, 68, 68, 0.75);
      box-shadow: 0 0 16px rgba(220, 38, 38, 0.40),
                  0 0 32px rgba(220, 38, 38, 0.16);
    }
    100% {
      border-color: rgba(220, 38, 38, 0.45);
      box-shadow: 0 0 10px rgba(220, 38, 38, 0.20),
                  0 0 20px rgba(220, 38, 38, 0.08);
    }
  }

  /* ── MAIN CONTENT ── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  #chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 0 16px 110px 16px;
    scroll-behavior: smooth;
    display: flex;
    flex-direction: column;
  }

  .chat-inner {
    max-width: 800px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding-top: 20px;
    flex: 1;
  }

  /* ── SOVEREIGN INTELLIGENCE CORE (CINEMATIC HERO) ── */
  .welcome-hero {
    margin: auto 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 20px;
    animation: coreFadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    user-select: none;
    pointer-events: none;
    position: relative;
    z-index: 5;
  }

  @keyframes coreFadeIn {
    0% {
      opacity: 0;
      transform: translateY(14px) scale(0.98);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  /* Central Visual Stage */
  .core-visual-stage {
    position: relative;
    width: 170px;
    height: 170px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
  }

  /* Deep Volumetric Ambient Glow */
  .core-deep-aura {
    position: absolute;
    width: 250px;
    height: 250px;
    background: radial-gradient(circle, rgba(239, 68, 68, 0.11) 0%, rgba(220, 38, 38, 0.035) 42%, rgba(15, 17, 23, 0) 70%);
    border-radius: 50%;
    filter: blur(28px);
    animation: deepAuraBreathe 8s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes deepAuraBreathe {
    0% {
      transform: scale(0.85);
      opacity: 0.35;
    }
    50% {
      transform: scale(1.1);
      opacity: 0.75;
    }
    100% {
      transform: scale(0.95);
      opacity: 0.45;
    }
  }

  /* Sovereign Core Vector Canvas */
  .core-svg-canvas {
    position: relative;
    z-index: 1;
    width: 170px;
    height: 170px;
    overflow: visible;
  }

  /* Layered Orbit Rotations */
  .core-orbit-ring-slow {
    transform-origin: 90px 90px;
    animation: orbitClockwise 64s linear infinite;
  }

  .core-orbit-ring-counter {
    transform-origin: 90px 90px;
    animation: orbitCounter 46s linear infinite;
  }

  @keyframes orbitClockwise {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes orbitCounter {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
  }

  /* Harmonic Floating Isometric Plates */
  .core-plate-top {
    animation: plateOscillateTop 6s ease-in-out infinite alternate;
  }

  .core-plate-mid {
    animation: plateOscillateMid 6s ease-in-out infinite alternate;
    animation-delay: -2s;
  }

  .core-plate-base {
    animation: plateOscillateBase 6s ease-in-out infinite alternate;
    animation-delay: -4s;
  }

  @keyframes plateOscillateTop {
    0% { transform: translateY(0px); opacity: 0.85; }
    50% { transform: translateY(-3.5px); opacity: 1; }
    100% { transform: translateY(0.5px); opacity: 0.8; }
  }

  @keyframes plateOscillateMid {
    0% { transform: translateY(0px); opacity: 0.75; }
    50% { transform: translateY(-1.5px); opacity: 0.95; }
    100% { transform: translateY(1px); opacity: 0.7; }
  }

  @keyframes plateOscillateBase {
    0% { transform: translateY(0px); opacity: 0.55; }
    50% { transform: translateY(1.5px); opacity: 0.8; }
    100% { transform: translateY(-0.5px); opacity: 0.5; }
  }

  /* Central Energy Singularity */
  .core-node-spark {
    transform-origin: 90px 90px;
    animation: sparkLuminescence 4s ease-in-out infinite alternate;
  }

  .core-node-corona {
    transform-origin: 90px 90px;
    animation: coronaPulse 4s ease-in-out infinite alternate;
  }

  @keyframes sparkLuminescence {
    0% {
      transform: scale(0.8);
      opacity: 0.65;
    }
    50% {
      transform: scale(1.2);
      opacity: 1;
    }
    100% {
      transform: scale(0.9);
      opacity: 0.7;
    }
  }

  @keyframes coronaPulse {
    0% {
      transform: scale(0.85);
      opacity: 0.3;
    }
    50% {
      transform: scale(1.3);
      opacity: 0.8;
    }
    100% {
      transform: scale(0.9);
      opacity: 0.35;
    }
  }

  /* Center Typography */
  .core-text-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    max-width: 520px;
  }

  .core-headline {
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -0.3px;
    line-height: 1.3;
    margin: 0;
    color: #f1f5f9;
    background: linear-gradient(115deg, #94a3b8 0%, #ffffff 35%, #fca5a5 50%, #ffffff 65%, #94a3b8 100%);
    background-size: 240% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: textGleam 9s ease-in-out infinite;
  }

  @keyframes textGleam {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .core-status-line {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 400;
    color: #64748b;
    letter-spacing: 0.2px;
    margin: 0;
  }

  .core-status-pip {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(239, 68, 68, 0.75);
    box-shadow: 0 0 6px rgba(239, 68, 68, 0.5);
    animation: pipBreathe 3s ease-in-out infinite alternate;
  }

  @keyframes pipBreathe {
    0% { opacity: 0.4; transform: scale(0.85); }
    100% { opacity: 1; transform: scale(1.15); }
  }


  /* ── CONVERSATION FLOW ── */
  .message-row {
    display: flex;
    gap: 14px;
    width: 100%;
    animation: msgEntrance 0.32s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes msgEntrance {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message-row.user {
    justify-content: flex-end;
  }

  .user-bubble-wrapper {
    max-width: 76%;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }

  .user-attached-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 6px;
    font-size: 11.5px;
    color: #94a3b8;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
  }
  .user-attached-chip svg {
    width: 12px;
    height: 12px;
    stroke: #94a3b8;
    flex-shrink: 0;
  }

  .message-row.user .message-bubble {
    background: #141720;
    color: #f1f5f9;
    padding: 12px 18px;
    border-radius: 16px 16px 4px 16px;
    font-size: 14.5px;
    line-height: 1.55;
    letter-spacing: -0.1px;
    white-space: pre-wrap;
    word-break: break-word;
    border: 1px solid rgba(255, 255, 255, 0.09);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
  }

  .message-row.assistant {
    justify-content: flex-start;
  }

  .assistant-avatar {
    width: 28px;
    height: 28px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .assistant-avatar svg {
    width: 16px;
    height: 16px;
  }

  .assistant-body {
    flex: 1;
    min-width: 0;
    color: var(--text-primary);
    font-size: 14.5px;
    line-height: 1.65;
  }

  /* ── SOVEREIGN DYNAMIC INTELLIGENCE INDICATOR (THINKING EXPERIENCE) ── */
  .sovereign-thinking-box {
    display: inline-flex;
    flex-direction: column;
    gap: 8px;
    background: rgba(18, 21, 28, 0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 10px 16px 10px 14px;
    margin-bottom: 12px;
    max-width: 480px;
    width: fit-content;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    transition: opacity 0.32s cubic-bezier(0.16, 1, 0.3, 1),
                max-height 0.32s cubic-bezier(0.16, 1, 0.3, 1),
                margin 0.32s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .sovereign-thinking-box.settling {
    opacity: 0;
    max-height: 0;
    margin-bottom: 0;
    padding-top: 0;
    padding-bottom: 0;
    transform: translateY(-6px);
    pointer-events: none;
    border-color: transparent;
  }

  .thinking-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }

  .thinking-core-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* Micro Luminous Breathing Intelligence Beacon */
  .thinking-core-beacon {
    width: 14px;
    height: 14px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .thinking-core-pip {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ef4444;
    box-shadow: 0 0 8px #ef4444, 0 0 14px rgba(239, 68, 68, 0.6);
    position: relative;
    z-index: 2;
    animation: beaconBreathe 2s ease-in-out infinite alternate;
  }

  .thinking-core-aura {
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 1px solid rgba(239, 68, 68, 0.65);
    animation: beaconRipple 2.2s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    pointer-events: none;
  }

  .thinking-core-aura.outer {
    inset: -6px;
    border-color: rgba(239, 68, 68, 0.3);
    animation: beaconRipple 2.2s cubic-bezier(0.25, 1, 0.5, 1) 0.55s infinite;
  }

  @keyframes beaconBreathe {
    0% { transform: scale(0.85); opacity: 0.8; }
    100% { transform: scale(1.2); opacity: 1; filter: drop-shadow(0 0 4px #ef4444); }
  }

  @keyframes beaconRipple {
    0% { transform: scale(0.6); opacity: 0.85; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  .thinking-title {
    font-size: 13px;
    font-weight: 500;
    color: #e2e8f0;
    letter-spacing: -0.1px;
  }

  .thinking-model-badge {
    display: inline-flex;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    color: #38bdf8;
    background: rgba(56, 189, 248, 0.1);
    border: 1px solid rgba(56, 189, 248, 0.28);
    padding: 1.5px 7px;
    border-radius: 6px;
    letter-spacing: 0.2px;
    margin-left: 6px;
    transition: all 0.2s ease;
  }

  .thinking-elapsed {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: #64748b;
    letter-spacing: 0.2px;
  }

  /* Activity Dynamic Phase Detail */
  .thinking-phase {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: #94a3b8;
    line-height: 1.4;
    padding-left: 24px;
  }

  .thinking-phase-tag {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: #f87171;
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid rgba(239, 68, 68, 0.22);
    padding: 1.5px 6px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .thinking-phase-text {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #cbd5e1;
    font-size: 12.5px;
  }

  /* Flowing energy line at bottom of thinking card */
  .thinking-energy-track {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 1.5px;
    background: rgba(255, 255, 255, 0.04);
    overflow: hidden;
  }

  .thinking-energy-bar {
    position: absolute;
    top: 0;
    height: 100%;
    width: 40%;
    background: linear-gradient(90deg, transparent, rgba(239, 68, 68, 0.8), rgba(244, 63, 94, 0.9), transparent);
    animation: energyScan 1.8s ease-in-out infinite;
  }

  @keyframes energyScan {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }

  /* Deliverable Card */
  .file-card-inline {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 12px 0;
    max-width: 400px;
    transition: all 0.15s ease;
  }
  .file-card-inline:hover {
    border-color: var(--border-hover);
    background: rgba(255,255,255,0.04);
  }
  .file-card-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .file-icon { font-size: 20px; flex-shrink: 0; }
  .file-text-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .file-text-meta { font-size: 12px; color: var(--text-muted); }
  .download-btn-pill {
    background: rgba(255,255,255,0.05);
    color: var(--text-primary);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    text-decoration: none;
    border: 1px solid var(--border-color);
    transition: background 0.15s ease;
  }
  .download-btn-pill:hover { background: rgba(255,255,255,0.1); }

  /* Markdown Content Styling */
  .assistant-body p { margin-bottom: 14px; }
  .assistant-body h1, .assistant-body h2, .assistant-body h3 {
    margin: 20px 0 10px 0;
    font-weight: 600;
    color: #fff;
  }
  .assistant-body h1 { font-size: 18px; }
  .assistant-body h2 { font-size: 16px; }
  .assistant-body h3 { font-size: 15px; }
  .assistant-body ul, .assistant-body ol { margin-left: 20px; margin-bottom: 14px; }
  .assistant-body li { margin-bottom: 6px; }
  
  .code-block {
    background: #000;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    margin: 14px 0;
    overflow: hidden;
  }
  .code-top {
    background: #111;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border-color);
  }
  .copy-code-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 12px;
    cursor: pointer;
  }
  .copy-code-btn:hover { color: #fff; }
  .code-content {
    padding: 14px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: #e2e8f0;
    overflow-x: auto;
    line-height: 1.5;
  }

  /* Assistant Text Entrance */
  .assistant-text {
    animation: textAppear 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @keyframes textAppear {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Tables */

            <g class="core-plate-top">
              <polygon points="90,56 120,70 90,84 60,70" fill="url(#plateFillTop)" stroke="url(#plateGradTop)" stroke-width="1.2" stroke-linejoin="round"/>
              <line x1="75" y1="63" x2="105" y2="77" stroke="rgba(255, 255, 255, 0.25)" stroke-width="0.8" stroke-linecap="round"/>
            </g>
          </svg>
        </div>

        <div class="core-text-wrap">
          <h1 class="core-headline">Intelligence, locally orchestrated.</h1>
          <div class="core-status-line">
            <span class="core-status-pip"></span>
            <span>Ready for your next task.</span>
          </div>
        </div>
      </div>
    `;
  }

  async function startNewChat() {
    SovereignAPI.cancelRequest();
    await SovereignAPI.resetSession();
    
    renderWelcomeHero();
    clearAttachment();
    
    const textarea = document.getElementById('user-textarea');
    if (textarea) {
      textarea.value = '';
      textarea.style.height = 'auto';
      textarea.disabled = false;
      textarea.focus();
    }
    
    isThinking = false;
    document.getElementById('send-btn').disabled = false;
  }

  window.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      startNewChat();
    }
  });

  async function fileChosen(input) {
    if (input.files && input.files[0]) {
      await uploadFile(input.files[0]);
    }
    input.value = '';
  }

  async function uploadFile(file) {
    const badge = document.getElementById('file-badge');
    const nameEl = document.getElementById('file-badge-name');
    nameEl.textContent = 'Uploading ' + file.name + '...';
    badge.style.display = 'inline-flex';

    try {
      const fd = new FormData();
      fd.append('file', file);
      const res = await fetch('/upload', { method: 'POST', body: fd });
      const data = await res.json();
      attachedFile = data.filename;
      nameEl.textContent = data.filename;
    } catch (e) {
      nameEl.textContent = 'Upload failed';
    }
  }

  function clearAttachment() {
    attachedFile = null;
    document.getElementById('file-badge').style.display = 'none';
  }

  function sendChat() {
    if (isThinking) return;
    const textarea = document.getElementById('user-textarea');
    let text = textarea.value.trim();
    const currentAttachment = attachedFile;
    if (!text && !currentAttachment) return;

    let promptText = text;
    if (currentAttachment) {
      promptText = text ? `${text} (File: ${currentAttachment})` : `Process file: ${currentAttachment}`;
    }

    textarea.value = '';
    autoExpand(textarea);
    clearAttachment();

    const hero = document.getElementById('welcome-hero');
    if (hero) hero.remove();

    appendMessage('user', text || `Process file: ${currentAttachment}`, currentAttachment);
    streamAssistant(promptText);
  }

  function appendMessage(role, text, fileAttachment) {
    const stream = document.getElementById('chat-stream');
    const row = document.createElement('div');
    row.className = `message-row ${role}`;
    if (role === 'user') {
      let chipHtml = '';
      if (fileAttachment) {
        chipHtml = `
          <div class="user-attached-chip">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
            </svg>
            <span>${escapeHtml(fileAttachment)}</span>
          </div>
        `;
      }
      row.innerHTML = `
        <div class="user-bubble-wrapper">
          ${chipHtml}
          <div class="message-bubble">${escapeHtml(text)}</div>
        </div>
      `;
    }
    stream.appendChild(row);
    scrollDown();
    return row;
  }

  function streamAssistant(promptText, isResume = false) {
    isThinking = true;
    document.getElementById('send-btn').disabled = true;
    const textarea = document.getElementById('user-textarea');
    if (textarea) textarea.disabled = true;

    const stream = document.getElementById('chat-stream');
    const row = document.createElement('div');
    row.className = 'message-row assistant';
    
    row.innerHTML = `
      <div class="assistant-avatar" title="Sovereign AI">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#f1f5f9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 12L12 17L22 12" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 17L12 22L22 17" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="assistant-body">
        <div class="sovereign-thinking-box" id="active-thinking-box">
          <div class="thinking-header">
            <div class="thinking-core-wrap">
              <div class="thinking-core-beacon">
                <div class="thinking-core-pip"></div>
                <div class="thinking-core-aura"></div>
                <div class="thinking-core-aura outer"></div>
              </div>
              <span class="thinking-title">Sovereign is working</span>
              <span class="thinking-model-badge" id="active-model-badge">phi4-mini</span>
            </div>
            <span class="thinking-elapsed" id="active-thinking-timer">0.0s</span>
          </div>
          <div class="thinking-phase">
            <span class="thinking-phase-tag" id="active-phase-tag">PLANNER</span>
            <span class="thinking-phase-text" id="active-phase-desc">Orchestrating multi-step execution plan...</span>
          </div>
          <div class="thinking-energy-track">
            <div class="thinking-energy-bar"></div>
          </div>
        </div>
        <div class="assistant-text"></div>
      </div>
    `;
    stream.appendChild(row);
    scrollDown();

    const thinkingBox = row.querySelector('#active-thinking-box');
    const timerEl = row.querySelector('#active-thinking-timer');
    const tagEl = row.querySelector('#active-phase-tag');
    const descEl = row.querySelector('#active-phase-desc');
    const modelBadgeEl = row.querySelector('#active-model-badge');
    const textContainer = row.querySelector('.assistant-text');

    const startTime = Date.now();
    const timerInterval = setInterval(() => {
      if (timerEl) {
        timerEl.textContent = ((Date.now() - startTime) / 1000).toFixed(1) + 's';
      }
    }, 100);

    const nodeModelMap = {
      neuron: 'phi4-mini',
      reasoning: 'phi4-mini',
      coding: 'qwen2.5-coder:3b',
      file_editing: 'qwen2.5-coder:3b',
      vision: 'granite3.2-vision:2b',
      document_tools: 'granite3.2-vision:2b',
      structured_extraction: 'granite3.2-vision:2b',
      validation: 'CalculationVerifier',
      tools: 'ArtifactGenerator',
      rag_engineering: 'nomic-embed-text',
      rag_commercial: 'nomic-embed-text',
      rag_compliance: 'nomic-embed-text',
      rag_workspace: 'nomic-embed-text',
      rag_codebase: 'nomic-embed-text',
      rag_formulas: 'nomic-embed-text',
      rag_table_extractor: 'nomic-embed-text',
      rag_defect_history: 'nomic-embed-text',
      planner: 'phi4-mini'
    };

    const nodeMeta = {
      planner: { tag: 'PLANNER', desc: 'Orchestrating multi-step execution plan...' },
      rag: { tag: 'KNOWLEDGE', desc: 'Querying vector store & technical SOPs...' },
      rag_engineering: { tag: 'ENGINEERING', desc: 'Querying engineering specs & SOPs...' },
      rag_compliance: { tag: 'COMPLIANCE', desc: 'Verifying regulatory & compliance standards...' },
      rag_workspace: { tag: 'WORKSPACE', desc: 'Scanning active workspace files & models...' },
      rag_codebase: { tag: 'CODEBASE', desc: 'Analyzing internal codebase architectures...' },
      rag_formulas: { tag: 'FORMULAS', desc: 'Retrieving engineering mathematics & formulas...' },
      rag_table_extractor: { tag: 'TABLES', desc: 'Extracting technical data matrices...' },
      rag_defect_history: { tag: 'DEFECTS', desc: 'Cross-referencing historical defect logs...' },
      rag_commercial: { tag: 'COMMERCIAL', desc: 'Checking cost models & procurement guidelines...' },
      vision: { tag: 'VISION', desc: 'Analyzing technical schematics & visual document stream...' },
      document_tools: { tag: 'DOCUMENT', desc: 'Parsing structured engineering files...' },
      coding: { tag: 'SANDBOX', desc: 'Executing calculations in sandbox...' },
      memory: { tag: 'MEMORY', desc: 'Accessing conversational memory & past decisions...' },
      reasoning: { tag: 'REASONING', desc: 'Synthesizing analysis & validating constraints...' },
      structured_extraction: { tag: 'EXTRACTION', desc: 'Extracting canonical facts & engineering schemas...' },
      validation: { tag: 'VALIDATION', desc: 'Verifying technical accuracy & policy rules...' },
      file_editing: { tag: 'DELIVERABLE', desc: 'Synthesizing deliverable document artifact...' },
      tools: { tag: 'ARTIFACTS', desc: 'Compiling structured output deliverables...' },
      plugin: { tag: 'PLUGIN', desc: 'Executing domain plugin tool...' },
      neuron: { tag: 'NEURON', desc: 'Routing query intent across neural agents...' }
    };

    function settleThinking() {
      clearInterval(timerInterval);
      if (thinkingBox) {
        thinkingBox.classList.add('settling');
        setTimeout(() => {
          if (thinkingBox && thinkingBox.parentNode) {
            thinkingBox.remove();
          }
        }, 340);
      }
    }

    let url = '';
    if (isResume) {
      url = '/resume?session_id=' + encodeURIComponent(SovereignAPI.currentSessionId);
    } else {
      url = '/chat?message=' + encodeURIComponent(promptText);
      if (SovereignAPI.currentSessionId) {
        url += '&session_id=' + encodeURIComponent(SovereignAPI.currentSessionId);
      }
    }
    const es = new EventSource(url);
    SovereignAPI.activeSSE = es;
    
    function cleanupState() {
      if (SovereignAPI.activeSSE === es) SovereignAPI.activeSSE = null;
      isThinking = false;
      document.getElementById('send-btn').disabled = false;
      const textarea = document.getElementById('user-textarea');
      if (textarea) {
        textarea.disabled = false;
        textarea.focus();
      }
    }

    es.onmessage = function(e) {
      if (e.data === '[DONE]') {
        es.close();
        settleThinking();
        fetchBackendData();
        cleanupState();
        return;
      }

      try {
        const d = JSON.parse(e.data);

        if (d.type === 'step') {
          const nodeKey = d.node || '';
          // The neuron emits the model selected for the task separately from
          // the Phi planner that made the routing decision.  Prefer that
          // selected model so the badge reflects the model about to execute.
          const activeModel = (nodeKey === 'neuron' ? d.selected_model : null) || d.model || nodeModelMap[nodeKey];
          if (activeModel && modelBadgeEl) {
            modelBadgeEl.textContent = activeModel;
            modelBadgeEl.style.display = 'inline-flex';
          }
          if (nodeKey === 'neuron' && d.filler_message) {
            if (tagEl) tagEl.textContent = 'NEURON';
            if (descEl) descEl.textContent = d.filler_message;
          } else if (nodeMeta[nodeKey]) {
            if (tagEl) tagEl.textContent = nodeMeta[nodeKey].tag;
            if (descEl) descEl.textContent = nodeMeta[nodeKey].desc;
          } else if (nodeKey.startsWith('rag_')) {
            const domain = nodeKey.replace('rag_', '').replace(/_/g, ' ');
            if (tagEl) tagEl.textContent = 'KNOWLEDGE';
            if (descEl) descEl.textContent = 'Searching ' + domain + ' knowledge base...';
          } else {
            if (tagEl) tagEl.textContent = (nodeKey || 'COMPUTE').toUpperCase();
            if (descEl) descEl.textContent = 'Executing ' + nodeKey.replace(/_/g, ' ') + '...';
          }
        }

        if (d.type === 'hitl_pause') {
          settleThinking();
          textContainer.innerHTML = parseMarkdown(d.preview || 'Human verification required before proceeding.');
          textContainer.innerHTML += `
            <div style="margin-top: 12px; display: flex; gap: 8px;">
              <button onclick="resumeHITL(this)" class="download-btn-pill" style="cursor: pointer;">Approve & Proceed</button>
              <button onclick="rejectHITL(this)" class="download-btn-pill" style="cursor: pointer; background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.3);">Reject</button>
            </div>
          `;
          scrollDown();
        }

        if (d.type === 'result') {
          settleThinking();
          textContainer.innerHTML = `<div class="response-content">${parseMarkdown(d.text)}</div>`;

          if (d.files && d.files.length > 0) {
            const recent = d.files[0];
            const fileCard = document.createElement('div');
            fileCard.className = 'file-card-inline';
            let icon = '📄';
            if (recent.name.endsWith('.docx')) icon = '📝';
            if (recent.name.endsWith('.xlsx')) icon = '📊';
            if (recent.name.endsWith('.pptx')) icon = '📈';

            fileCard.innerHTML = `
              <div class="file-card-left">
                <div class="file-icon">${icon}</div>
                <div style="min-width:0;">
                  <div class="file-text-name">${escapeHtml(recent.name)}</div>
                  <div class="file-text-meta">${recent.size_kb} KB &middot; Generated Deliverable</div>
                </div>
              </div>
              <a href="/download/${encodeURIComponent(recent.name)}" download class="download-btn-pill">
                Download
              </a>
            `;
            textContainer.appendChild(fileCard);
          }

          if (d.latency) {
            const metaBar = document.createElement('div');
            metaBar.className = 'response-meta-bar';
            metaBar.innerHTML = `
              <span>
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                ${d.latency}s latency
              </span>
              ${d.nodes && d.nodes.length ? `<span>&middot;</span><span>${d.nodes.length} nodes verified</span>` : ''}
              <span>&middot;</span>
              <span>Local verification</span>
            `;
            textContainer.appendChild(metaBar);
          }

          scrollDown();
        }

        if (d.type === 'error') {
          settleThinking();
          let errorMsg = d.text || 'An unexpected error occurred during processing.';
          textContainer.innerHTML = `<span style="color:#f87171;">⚠️ ${escapeHtml(errorMsg)}</span>`;
          es.close();
          cleanupState();
        }

      } catch(err){}
    };

    es.onerror = function() {
      es.close();
      settleThinking();
      textContainer.innerHTML = `<span style="color:#f87171;">⚠️ Connection lost. Please try again.</span>`;
      cleanupState();
    };
  }

  function scrollDown() {
    const c = document.getElementById('chat-container');
    c.scrollTop = c.scrollHeight;
  }

  window.resumeHITL = function(btn) {
    const parent = btn.parentElement;
    if (parent) parent.style.display = 'none';
    appendMessage('user', 'Approved pending operation', null);
    streamAssistant('', true);
  };

  window.rejectHITL = function(btn) {
    const parent = btn.parentElement;
    if (parent) parent.style.display = 'none';
    const textarea = document.getElementById('user-textarea');
    if (textarea) {
      textarea.value = 'Reject';
    }
    sendChat();
  };

  function parseMarkdown(raw) {
    if (!raw) return '';
    let out = escapeHtml(raw);

    out = out.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, function(match, lang, code) {
      const id = 'c_' + Math.random().toString(36).substr(2, 8);
      return `
        <div class="code-block">
          <div class="code-top">
            <span>${lang ? lang.toUpperCase() : 'CODE'}</span>
            <button class="copy-code-btn" onclick="copySnippet('${id}')">Copy</button>
          </div>
          <pre class="code-content" id="${id}">${code}</pre>
        </div>
      `;
    });

    out = out.replace(/`([^`]+)`/g, '<code style="background:rgba(255,255,255,0.08);padding:2px 4px;border-radius:4px;font-family:var(--font-mono);font-size:13px;">$1</code>');
    out = out.replace(/^### (.*$)/gim, '<h3>$1</h3>');
    out = out.replace(/^## (.*$)/gim, '<h2>$1</h2>');
    out = out.replace(/^# (.*$)/gim, '<h1>$1</h1>');
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    out = out.replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>');

    // Markdown Tables (| Col1 | Col2 | ...)
    out = out.replace(/((?:\|[^\n]+\|\r?\n?)+)/g, function(tableBlock) {
      const lines = tableBlock.trim().split(/\r?\n/).filter(l => l.trim().startsWith('|'));
      if (lines.length < 2) return tableBlock;

      let html = '<table>';
      let isHeader = true;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (/^\|(\s*[-:]+[-| :]*)\|$/.test(line)) {
          isHeader = false;
          continue;
        }
        const cells = line.split('|').slice(1, -1);
        html += '<tr>';
        cells.forEach(cell => {
          const content = cell.trim();
          html += isHeader ? `<th>${content}</th>` : `<td>${content}</td>`;
        });
        html += '</tr>';
        if (i === 0 && lines[1] && /^\|(\s*[-:]+[-| :]*)\|$/.test(lines[1].trim())) {
          isHeader = false;
        }
      }
      html += '</table>';
      return html;
    });

    out = out.replace(/^\- (.*$)/gim, '<li>$1</li>');
    out = out.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
    out = out.replace(/\n\n/g, '<br><br>');
    return out;
  }

  function copySnippet(id) {
    const el = document.getElementById(id);
    if (!el) return;
    navigator.clipboard.writeText(el.innerText).then(() => {});
  }

  function escapeHtml(text) {
    return (text || '').replace(/&/g, "&amp;")
                       .replace(/</g, "&lt;")
                       .replace(/>/g, "&gt;")
                       .replace(/"/g, "&quot;")
                       .replace(/'/g, "&#039;");
  }

  async function fetchBackendData() {
    const statusText = document.getElementById('header-status-text');
    const statusDot = document.querySelector('#header-status .status-dot');
    if (!statusText || !statusDot) return;

    // Immediate client-side detection if WiFi / network is disabled
    if (typeof navigator !== 'undefined' && navigator.onLine === false) {
      statusText.textContent = 'Local-only execution observed';
      statusText.style.color = 'var(--accent)';
      statusDot.style.background = 'var(--accent)';
      statusDot.style.boxShadow = '0 0 8px var(--accent)';
      return;
    }

    try {
      const healthRes = await fetch('/health');
      const health = await healthRes.json();
      
      if (health.air_gapped) {
        statusText.textContent = 'Local-only execution observed';
        statusText.style.color = 'var(--accent)';
        statusDot.style.background = 'var(--accent)';
        statusDot.style.boxShadow = '0 0 8px var(--accent)';
      } else {
        statusText.textContent = 'External connection detected';
        statusText.style.color = '#f87171';
        statusDot.style.background = '#f87171';
        statusDot.style.boxShadow = '0 0 8px #f87171';
      }
    } catch (e) {
      if (typeof navigator !== 'undefined' && navigator.onLine === false) {
        statusText.textContent = 'Local-only execution observed';
        statusText.style.color = 'var(--accent)';
        statusDot.style.background = 'var(--accent)';
        statusDot.style.boxShadow = '0 0 8px var(--accent)';
      }
    }
  }

  window.addEventListener('load', () => {
    SovereignAPI.resetSession();
    fetchBackendData();
    setInterval(fetchBackendData, 4000);
  });
  window.addEventListener('online', fetchBackendData);
  window.addEventListener('offline', fetchBackendData);
</script>
